<ng-container [ngSwitch]="true">
  <ng-container *ngSwitchCase="['slim', 'slim+'].includes(sidebarType$ | async)">
    <div class="md:flex flex-col z-10 transition-[width] duration-300 ease-in-out h-full border-e-0 relative bg-surface-0 dark:bg-surface-900 rounded-xl ltr:me-4 rtl:me-4" style="box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px" [class.flex-col-reverse]="(profileMenu$ | async) == 'start'" [ngClass]="{ 'w-0': !(show_sidebar$ | async), 'w-[6rem]': show_sidebar$ | async }" [class.!w-[7rem]]="(show_sidebar$ | async) && (sidebarType$ | async) == 'slim+'" [class.overflow-hidden]="!(show_sidebar$ | async)">
      <div class="grow-1 py-1" [class.py-4]="(profileMenu$ | async) == 'end'">
        <p-tiered-menu appendTo="body" [model]="sidebarItems$ | async" styleClass="min-w-0 border-0 rounded-none bg-transparent slim-menu">
          <ng-template #item let-item let-hasSubmenu="hasSubmenu">
            <ng-container *ngIf="item.route; else urlRef">
              <a pRipple [routerLink]="item.route" class="flex items-center p-tieredmenu-item-link" [class.justify-center]="item.state?.level == 1" [class.min-w-[12rem]]="item.state?.level > 1">
                <span class="flex flex-col">
                  <i *ngIf="item.icon" [icon-name]="item.icon" class="p-tieredmenu-item-icon text-[2rem]!"></i>
                  <span class="font-light" *ngIf="(sidebarType$ | async) == 'slim+' || item?.state?.level > 1">{{ item.label }}</span>
                </span>
              </a>
            </ng-container>
            <ng-template #urlRef>
              <a pRipple *ngIf="item.url; else noLink" [href]="item.url" class="flex items-center justify-center p-tieredmenu-item-link" [class.min-w-[12rem]]="item.state?.level > 1">
                <span class="flex flex-col">
                  <i *ngIf="item.icon" [icon-name]="item.icon" class="p-tieredmenu-item-icon text-[2rem]!"></i>
                  <span class="font-light" *ngIf="(sidebarType$ | async) == 'slim+' || item?.state?.level > 1">{{ item.label }}</span>
                </span>
              </a>

              <ng-template #noLink>
                <a pRipple class="flex items-center justify-center p-tieredmenu-item-link" [class.min-w-[12rem]]="item.state?.level > 1">
                  <span class="flex flex-col" [class.me-auto]="item.state?.level > 1">
                    <i *ngIf="item.icon" [icon-name]="item.icon" class="p-tieredmenu-item-icon text-[2rem]!"></i>
                    <span *ngIf="(sidebarType$ | async) == 'slim+' || item?.state?.level > 1" class="font-light">{{ item.label }}</span>
                  </span>
                  <i *ngIf="hasSubmenu && item?.state?.level > 1" class="pi pi-angle-right"></i>
                </a>
              </ng-template>
            </ng-template>
          </ng-template>
        </p-tiered-menu>
      </div>
    </div>
  </ng-container>
  <ng-container *ngSwitchCase="['static'].includes(sidebarType$ | async)">
    <div class="flex flex-col z-10 transition-[width] duration-300 ease-in-out h-full fixed static bg-surface-0 dark:bg-surface-900 rounded-xl ltr:me-4 rtl:me-4" style="box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px" [class.flex-col-reverse]="(profileMenu$ | async) == 'start'" [ngClass]="{ 'w-0': !(show_sidebar$ | async), 'w-[17rem]': show_sidebar$ | async }">
      <div class="grow-1 overflow-y-auto py-1" [class.py-4]="(profileMenu$ | async) == 'end'">
        <p-panelmenu *ngIf="show_sidebar$ | async" [model]="sidebarItems$ | async" styleClass="[&>*]:border-0">
          <ng-template #item let-item>
            <ng-container *ngIf="item.route; else urlRef">
              <a pRipple [routerLink]="item.route" class="flex items-center px-4 py-2 cursor-pointer group">
                <i [icon-name]="item.icon"></i>
                <span class="ms-2">
                  {{ item.label }}
                </span>
                <i *ngIf="item.items" class="pi pi-angle-down ms-auto"></i>
              </a>
            </ng-container>
            <ng-template #urlRef>
              <a pRipple *ngIf="item.url; else noLink" [href]="item.url" class="flex items-center px-4 py-2 cursor-pointer group">
                <i [icon-name]="item.icon"></i>
                <span class="ms-2">
                  {{ item.label }}
                </span>
                <i *ngIf="item.items" class="pi pi-angle-down ms-auto"></i>
              </a>
              <ng-template #noLink>
                <a pRipple class="flex items-center px-4 py-2 cursor-pointer group">
                  <i [icon-name]="item.icon"></i>
                  <span class="ms-2">
                    {{ item.label }}
                  </span>
                  <i *ngIf="item.items" class="pi pi-angle-down ms-auto"></i>
                </a>
              </ng-template>
            </ng-template>
          </ng-template>
        </p-panelmenu>
      </div>
    </div>
  </ng-container>
  <ng-container *ngSwitchCase="['none'].includes(sidebarType$ | async)"> </ng-container>
</ng-container>
